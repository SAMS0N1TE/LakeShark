## IDF Component Manager Manifest File
dependencies:
  espressif/esp_wifi_remote:
    version: "0.*"

  # LS-008
  espressif/esp_hosted:
    version: "==2.12.9"

  # LS-601  esp-brookesia was the only thing constraining LVGL to 8.x
  # (it asked >=8.3,<9). esp_lvgl_port and the Waveshare BSP both ask
  # >=8,<10, so dropping brookesia silently resolved LVGL 9.5.0 and broke
  # the build. The whole sdr_ui shell is written against 8.4 - see LS-903.
  lvgl/lvgl:
    version: "==8.4.0"
