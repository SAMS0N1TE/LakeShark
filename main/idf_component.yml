## IDF Component Manager Manifest File
dependencies:
  # arduino-esp32 as a component: provides the Arduino core (SPIClass, GPIO,
  # timing) that LoRaMesher + RadioLib build against. 3.2.x targets IDF 5.4.
  espressif/arduino-esp32:
    version: ">=3.2.0,<3.3.0"

  espressif/esp_wifi_remote:
    version: "0.*"

  # Pinned to match the ESP-Hosted slave firmware already on the C6
  # (network_adapter 2.12.3). The transport works across the skew, but HCI
  # commands time out with the 2.12.12 host, so keep host and slave in step.
  # If the C6 is ever reflashed, bump both together.
  espressif/esp_hosted:
    version: "==2.12.3"

  espressif/esp-brookesia:
    version: "^0.4.2"   # bumped from "0.4.*" to pin the minor 24h-clock + 720x1280 fixes