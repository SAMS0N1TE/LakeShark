<!doctype html>
<!-- The web screen (ls_rterm.c): the board's screen in a phone's or a PC's
     browser, served by the board. pack.py inlines the scripts and gzips it. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>LakeShark</title>
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="LakeShark">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icon-180.png">
<link rel="icon" href="/icon-192.png">
<style>
  :root { --ink: #e9eaee; --dim: #8a8f98; --line: #2a2e35; --hot: #46d6e0; --bad: #f14c4c; }
  html, body { margin: 0; height: 100%; background: #000; color: var(--ink); overflow: hidden;
    font: 15px/1.35 Menlo, Consolas, "IBM Plex Mono", monospace; -webkit-text-size-adjust: 100%; }
  body { display: flex; flex-direction: column; padding: env(safe-area-inset-top) env(safe-area-inset-right)
    env(safe-area-inset-bottom) env(safe-area-inset-left); box-sizing: border-box;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  #stage { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; position: relative; }
  canvas { display: block; touch-action: none; image-rendering: pixelated; }
  #bar { display: flex; gap: 4px; padding: 4px; border-top: 1px solid var(--line); }
  #bar button { flex: 1; min-width: 0; height: 40px; background: #0d0f12; color: var(--ink); border: 1px solid var(--line);
    border-radius: 6px; font: inherit; font-size: 14px; touch-action: manipulation; padding: 0; }
  #bar button:active { background: #1b2027; }
  #bar button.on { color: #000; background: var(--hot); border-color: var(--hot); }
  #note { position: absolute; left: 0; right: 0; top: 0; bottom: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 12px; padding: 24px; text-align: center; background: rgba(0,0,0,.82); }
  #note[hidden] { display: none; }
  #note h1 { margin: 0; font-size: 18px; letter-spacing: .12em; color: var(--hot); font-weight: normal; }
  #note p { margin: 0; color: var(--dim); max-width: 24em; }
  #note .bad { color: var(--bad); }
  #login { display: flex; gap: 6px; }
  #login[hidden] { display: none; }
  #login input, #note button { font: inherit; font-size: 16px; height: 42px; border-radius: 6px; border: 1px solid var(--line);
    background: #0d0f12; color: var(--ink); padding: 0 12px; }
  #login input { width: 12em; }
  #note button { background: var(--hot); color: #000; border-color: var(--hot); }
  #type { position: absolute; left: -1000px; top: 0; width: 10px; height: 10px; opacity: 0; font-size: 16px; }
  #panel { position: absolute; right: 0; top: 0; bottom: 0; width: min(330px, 92vw); box-sizing: border-box; overflow: auto;
    background: #07090c; border-left: 1px solid var(--line); padding: 8px 12px 16px; }
  #panel[hidden] { display: none; }
  #panel h2 { margin: 14px 0 6px; font-size: 12px; font-weight: normal; letter-spacing: .14em; color: var(--hot); }
  #panel h2:first-child { margin-top: 4px; }
  #panel .row { display: flex; gap: 6px; align-items: center; margin: 5px 0; }
  #panel button { flex: 1; min-width: 0; height: 34px; padding: 0 4px; background: #0d0f12; color: var(--ink);
    border: 1px solid var(--line); border-radius: 6px; font: inherit; font-size: 13px; }
  #panel button:active { background: #1b2027; }
  #panel button.on { color: #000; background: var(--hot); border-color: var(--hot); }
  #panel button.warn { border-color: #6b3b3b; color: #f0a0a0; }
  #panel .val { min-width: 4.5em; text-align: center; }
  #panel .st { color: var(--dim); font-size: 12px; white-space: pre-wrap; margin: 2px 0; }
  #panel input { flex: 2; min-width: 0; height: 32px; box-sizing: border-box; padding: 0 8px; background: #0d0f12;
    color: var(--ink); border: 1px solid var(--line); border-radius: 6px; font: inherit; font-size: 13px;
    -webkit-user-select: text; user-select: text; }
  #panel .lbl { width: 2.2em; color: var(--dim); font-size: 12px; }
</style>
</head>
<body>
<div id="stage">
  <canvas id="screen"></canvas>
  <div id="note">
    <h1>LAKESHARK</h1>
    <p id="say">Connecting to the board...</p>
    <form id="login" hidden>
      <input id="pass" type="password" autocomplete="current-password" autocapitalize="off" autocorrect="off"
             spellcheck="false" placeholder="password" aria-label="Terminal password">
      <button type="submit">SIGN IN</button>
    </form>
    <button id="again" hidden>WATCH HERE</button>
  </div>
  <aside id="panel" hidden aria-label="Board settings"></aside>
</div>
<div id="bar">
  <button data-key="Escape" aria-label="Escape">ESC</button>
  <button data-key="ArrowLeft" aria-label="Left">&#9664;</button>
  <button data-key="ArrowUp" aria-label="Up">&#9650;</button>
  <button data-key="ArrowDown" aria-label="Down">&#9660;</button>
  <button data-key="ArrowRight" aria-label="Right">&#9654;</button>
  <button data-key="Enter" aria-label="Enter">OK</button>
  <button id="kbd" aria-label="Keyboard">&#9000;</button>
  <button id="gear" aria-label="Board settings" hidden>&#9881;</button>
</div>
<input id="type" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false"
       tabindex="-1" aria-hidden="true">
<script>var exports = {};</script>
<script src="xterm-headless.js"></script>
<script src="screen.js"></script>
</body>
</html>
