# The one rule that keeps board support from turning back into a fork:
# outside components/lakeshark/board/, no file may ask which board it is on.
# It asks what the board CAN DO - an LS_HAS_* capability from ls_caps.h.
#
# Without this check the rule decays quietly: one #ifdef CONFIG_LS_BOARD_X in
# the DSP is all it takes, and then board five needs edits in ten files
# instead of one header. See docs/PORTING.md.
name: board rule

on:
  push:
  pull_request:

jobs:
  no-board-ifdefs-outside-board-dir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Match a real macro only. Comments refer to the family as
      # CONFIG_LS_BOARD_* with an asterisk, and a bare substring search counts
      # those as violations - which it did, on every commit, including ones
      # that touched nothing but the README. A rule that always fails is a
      # rule nobody reads.
      - name: No CONFIG_LS_BOARD_* outside components/lakeshark/board/
        run: |
          hits=$(grep -rn --include='*.c' --include='*.h' --include='*.cpp' --include='*.cc' \
                   -E 'CONFIG_LS_BOARD_[A-Z0-9_]+' components main \
                 | grep -v '^components/lakeshark/board/' || true)
          if [ -n "$hits" ]; then
            echo "::error::board identity leaked outside components/lakeshark/board/"
            echo "$hits"
            echo
            echo "Test a capability from board/ls_caps.h (LS_HAS_*) instead of a board name."
            echo "If no capability fits, add one to ls_caps.h derived from a fact in the variant header."
            exit 1
          fi
          echo "OK: no board-identity tests outside the board layer"

      - name: Capabilities are derived, never hand-set in a variant
        run: |
          hits=$(grep -rn '#define[[:space:]]\+LS_HAS_' components/lakeshark/board/variants || true)
          if [ -n "$hits" ]; then
            echo "::error::a variant header defined an LS_HAS_* capability directly"
            echo "$hits"
            echo
            echo "Variants declare physical facts (pins, panel, flash). ls_caps.h derives LS_HAS_*."
            exit 1
          fi
          echo "OK: capabilities are derived only"

      - name: The old hand-set capability names are gone
        run: |
          hits=$(grep -rn --include='*.c' --include='*.h' --include='*.cpp' \
                   'LS_BOARD_HAS_' components main \
                 | grep -v '^components/lakeshark/board/' || true)
          if [ -n "$hits" ]; then
            echo "::error::LS_BOARD_HAS_* is the pre-ls_caps.h spelling; use LS_HAS_*"
            echo "$hits"
            echo
            echo "This matters: '#if LS_BOARD_HAS_VBUS_CTRL' on an undefined macro is silently 0."
            exit 1
          fi
          echo "OK"
