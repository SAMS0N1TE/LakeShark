name: build matrix

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false          # one broken board must not hide the others
      matrix:
        include:
          - name: p4-nano
            idf_version: v5.4.3
            defaults: boards/nano_headless_ble.defaults
          - name: p4-wifi6
            idf_version: v5.4.3
            defaults: boards/wifi6_headless_ble.defaults
          - name: p4-touch-lcd-43
            idf_version: v5.4.3
            defaults: boards/lcd43_gui.defaults
          - name: p4-touch-lcd-4b
            idf_version: v5.4.3
            defaults: boards/touch_lcd_4b_gui.defaults
          - name: p4-nano-nobt
            idf_version: v5.4.3
            defaults: boards/nano_headless_nobt.defaults
          - name: t-display-p4
            idf_version: v5.5.4
            defaults: boards/t_display_p4.defaults
          - name: t-display-p4-tft
            idf_version: v5.5.4
            defaults: boards/t_display_p4.defaults;boards/t_display_p4_tft.defaults

    name: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v4

      - name: Build
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: ${{ matrix.idf_version }}
          target: esp32p4
          command: |
            set -eu
            if [ "${{ matrix.idf_version }}" = "v5.5.4" ]; then
              patch_dir="$PWD/bench/patches"
              for patch in "$patch_dir"/esp-idf-v5.5.4-*.patch; do
                git -C "$IDF_PATH" apply "$patch"
              done
            else
              python tools/prepare_sdk.py --idf "$IDF_PATH"
            fi
            idf.py -B build -DSDKCONFIG=build/sdkconfig \
              -DSDKCONFIG_DEFAULTS="sdkconfig.defaults;${{ matrix.defaults }}" build

      - name: Report size
        run: |
          echo "### ${{ matrix.name }}" >> "$GITHUB_STEP_SUMMARY"
          ls -l build/lakeshark.bin | awk '{print "firmware: " $5 " bytes"}' >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: lakeshark-${{ matrix.name }}
          path: |
            build/lakeshark.bin
            build/bootloader/bootloader.bin
            build/partition_table/partition-table.bin
          if-no-files-found: error
